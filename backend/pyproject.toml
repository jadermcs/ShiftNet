[project]
name = "shiftnet-backend"
version = "0.1.0"
description = "ShiftNet backend: typed models that commit lexicon data to Postgres, sense discovery over fineweb-edu with LexSPLADE, and an MCP server."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
discovery = [
  "torch>=2.4",
  "sentence-transformers>=5.1",
  "datasets>=3.0",
  "threadpoolctl>=3.1",
  "scipy>=1.13",
  "numpy>=1.26",
  "wn>=0.11",
  "pyarrow>=15",
  "pandas>=2.2",
]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
shiftnet = "shiftnet_backend.cli:main"
shiftnet-mcp = "shiftnet_backend.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "pgserver>=0.1.4"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# CUDA 13.0 build (RTX 50xx / Blackwell needs cu128+). On a machine without a GPU, switch to
# name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu".
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shiftnet_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
